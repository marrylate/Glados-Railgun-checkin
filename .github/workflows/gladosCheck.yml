name: GLaDOS Check-in

on:
  workflow_dispatch:
  push:
    # 2026-11-10 修正：仓库默认分支是 master，原来只写 main，导致手动 push 永远不触发运行
    branches: [ master, main ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  schedule:
    # 提交本文件必须使用可关联的账号身份（<ID>+user@users.noreply.github.com），
    # 否则 GitHub 会静默丢弃定时触发（2026-10-08 已踩坑并修复）。
    #
    # 2026-11-06：GitHub 原生 cron 实测延迟 30 分钟~8 小时、偶尔整天不投递
    # （2026-11-06 北京 00:05 主触发丢失、00:35 兜底到 01:10 仍未触发 → 静默漏签）。
    # 所以一天挂多个点，只要当天任意一次被投递就能签上；
    # 通知用 actions/cache 做跨运行去重（.tgstate/pushed-YYYY-MM-DD），
    # 同一天只推第一条，不会因为多点触发而刷屏。
    #
    # 2026-11-13：签到积分改成「服务端结算 = Base + 套餐 + 连续 + Cable(+1~+9) + …」，
    # 其中 Cable 按线路指数分档、越差给得越高，同一账号不同时刻能差 8 分。
    # 于是改成每 30 分钟一个点：脚本先探档位，档位不够就主动不签、等下一个点，
    # 北京 20:00 之后进入保底时段，不管档位直接签（保连续天数）。
    - cron: '*/30 * * * *'

# 定时与手动触发可能重叠：同一时间只保留一个运行，避免重复签到与重复推送
# （合并上游 2026-11：本地 6 个 cron 点，串行排队，不互相取消）
concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ubuntu-latest

    # 脚本自带运行预算；这里再兜底，避免异常情况卡住
    timeout-minutes: 15

    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: [3.13]

    # 这里加入全局环境变量，强制后续所有第三方 actions 兼容 Node.js 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    # 恢复「今天是否已推送过」标记（跨运行去重，见 tg_notify.pushed_today）
    - name: Restore push flag
      uses: actions/cache/restore@v4
      with:
        path: .tgstate
        key: tgpush-${{ github.run_id }}
        restore-keys: |
          tgpush-

    - name: Prepare state dir
      run: mkdir -p .tgstate

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # 安装 python 库（上游 2026-10-18 改为读 requirements.txt）
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install telethon

    # 执行 签到脚本（签到结果会推送到 Telegram「签到通知」频道）
    - name: Running checkin
      id: checkin
      run: |
        python checkin.py
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
        GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}
        # ---- 线路加成闸门（2026-11-13）----
        # on  = 探档位，不够就等下一个 cron 点（默认）
        # off = 恢复「到点就签」，用于回滚/排查
        GLADOS_CABLE_MODE: 'on'
        # Cable 加成达到该值才签：<90→9 / 90-94→7 / 95-99→5 / 100-109→3 / 110-130→2 / >130→1
        GLADOS_CABLE_MIN: '7'
        # 北京时间几点之后不再挑档位、无条件签（保连续签到天数）
        GLADOS_CABLE_FALLBACK_HOUR: '20'
        # ---- Cloudflare Turnstile 打码（2026-11-14）----
        # GLaDOS 签到新增 Turnstile：token 只能由真浏览器拿，云端 runner 拿不到
        # （实测要求人工交互、连 iframe 都不建）。想在云端签，只能把过验证外包给打码平台。
        # 在仓库 Secrets 里加 SOLVER_API_KEY 即自动启用（默认 capsolver）；
        # 不配则遇到验证时跳过、不误报，由本机浏览器脚本补签。
        GLADOS_SOLVER: ${{ secrets.GLADOS_SOLVER }}
        SOLVER_API_KEY: ${{ secrets.SOLVER_API_KEY }}
        # ---- Telegram 推送（新增 2026-10-07）----
        TG_API_ID: ${{ secrets.TG_API_ID }}
        TG_API_HASH: ${{ secrets.TG_API_HASH }}
        TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        TG_NOTIFY_CHANNEL_ID: ${{ secrets.TG_NOTIFY_CHANNEL_ID }}
        TG_NOTIFY_CHANNEL_HASH: ${{ secrets.TG_NOTIFY_CHANNEL_HASH }}
        TG_STATE_DIR: ${{ github.workspace }}/.tgstate

    # 保存「今天已推送」标记，供后续兜底 cron 点判断是否还要推
    - name: Save push flag
      if: always()
      uses: actions/cache/save@v4
      with:
        path: .tgstate
        key: tgpush-${{ github.run_id }}

    # 兜底通知：签到脚本已成功推送则静默跳过；脚本秒退/崩溃时补一条告警
    - name: Fallback Telegram notify
      if: always()
      run: |
        python tg_notify.py --fallback "GLaDOS 签到异常" "签到步骤结果: ${{ steps.checkin.outcome }}，脚本可能秒退或未能推送成功。"
      env:
        TG_API_ID: ${{ secrets.TG_API_ID }}
        TG_API_HASH: ${{ secrets.TG_API_HASH }}
        TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        TG_NOTIFY_CHANNEL_ID: ${{ secrets.TG_NOTIFY_CHANNEL_ID }}
        TG_NOTIFY_CHANNEL_HASH: ${{ secrets.TG_NOTIFY_CHANNEL_HASH }}
        TG_STATE_DIR: ${{ github.workspace }}/.tgstate

    - name: Keep alive
      if: ${{ !cancelled() }}
      uses: liskin/gh-workflow-keepalive@v1

    - name: Delete workflow runs
      if: ${{ !cancelled() }}
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        # 2026-11-13：cron 加密到每 30 分钟（约 48 次/天），
        # 清理阈值跟着放宽，避免每次运行都去翻几百条历史、把 API 打满。
        retain_days: 3
        keep_minimum_runs: 200
        delete_run_by_conclusion_pattern: success
