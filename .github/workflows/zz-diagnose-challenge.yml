name: zz-diagnose-challenge

# 临时诊断（2026-11-10）：确认 GLaDOS challenge 端点是否可用，跑完即删
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install requests
      - name: Probe challenge endpoint
        run: |
          python - <<'PY'
          import os, json, hashlib, requests

          raw = os.environ.get("GLADOS_COOKIES", "").strip()
          # 兼容 JSON 数组 / & 分隔 / 单串
          cookie = raw
          try:
              data = json.loads(raw)
              if isinstance(data, list) and data:
                  cookie = data[0].get("cookie", "") if isinstance(data[0], dict) else str(data[0])
              elif isinstance(data, dict):
                  cookie = data.get("cookie", "")
          except Exception:
              if "&" in raw:
                  cookie = raw.split("&")[0]
          print("cookie 字段数:", len([p for p in cookie.split(";") if "=" in p]))

          ua = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
          h = {"origin": "https://glados.cloud", "user-agent": ua, "cookie": cookie,
               "accept": "application/json, text/plain, */*"}

          for path in ["/api/user/checkin/challenge", "/api/user/status"]:
              try:
                  r = requests.get("https://glados.cloud" + path, headers=h, timeout=30)
                  body = r.text[:400]
                  print(f"[{path}] HTTP {r.status_code} -> {body}")
                  if "challenge" in path:
                      try:
                          j = r.json()
                          if j.get("code") == 0 and j.get("nonce"):
                              proof = hashlib.sha256(
                                  f"{j['nonce']}.glados-observe-v1".encode()).hexdigest()
                              print("CHALLENGE_OK nonce_len=", len(str(j["nonce"])),
                                    "proof_prefix=", proof[:12])
                          else:
                              print("CHALLENGE_FAIL", json.dumps(j, ensure_ascii=False)[:300])
                      except Exception as e:
                          print("CHALLENGE_PARSE_ERR", e)
              except Exception as e:
                  print(f"[{path}] ERR {type(e).__name__}: {e}")
          PY
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
