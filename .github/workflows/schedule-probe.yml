name: schedule-probe

# ⚠️ 临时探针文件 —— 仅用于验证 GitHub 定时调度是否真的注册成功。
# 只做 echo，不签到、不推送通知。验证完毕后立即删除。

on:
  schedule:
    - cron: '7 4 * * *'   # 每天 UTC 04:07 = 北京 12:07（低频探子）
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe fired
        run: |
          echo "PROBE_FIRED"
          echo "event=${{ github.event_name }}"
          date -u "+utc=%Y-%m-%d %H:%M:%S"
